<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Basics Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <p class="eyebrow">Assignment #5</p>
      <h1>Personal Profile</h1>
      <p class="intro">Part 1, Task 1: a JavaScript object with different data types.</p>
      <div class="profile-grid">
        <div class="profile-row">
          <span class="label">Name</span>
          <span id="profile-name"></span>
        </div>
        <div class="profile-row">
          <span class="label">Birth year</span>
          <span id="profile-birth-year"></span>
        </div>
        <div class="profile-row">
          <span class="label">Developer</span>
          <span id="profile-developer"></span>
        </div>
        <div class="profile-row">
          <span class="label">Hobbies</span>
          <span id="profile-hobbies"></span>
        </div>
      </div>

      <h2>Calculations</h2>
      <div class="profile-grid">
        <div class="profile-row">
          <span class="label">Current age</span>
          <span id="profile-age"></span>
        </div>
        <div class="profile-row">
          <span class="label">Total hobbies</span>
          <span id="profile-hobbies-count"></span>
        </div>
      </div>

      <h2>Update Profile</h2>
      <form id="profile-form">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>

        <label for="birth-year">Birth Year</label>
        <input id="birth-year" name="birth-year" type="number" required>

        <button type="submit">Create / Update Profile</button>
      </form>

      <h2>Hobbies List</h2>
      <input id="new-hobby" type="text" placeholder="Enter a hobby">
      <button id="add-hobby" type="button">Add Item</button>
      <button id="remove-hobby" type="button">Remove Item</button>
      <ul id="hobbies-list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
